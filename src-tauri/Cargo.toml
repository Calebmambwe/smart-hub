[package]
name = "smart-hub"
version = "0.1.0"
description = "Unified command center for Claude Code, Smart Desk, and development pipelines"
authors = ["Caleb Mambwe"]
edition = "2021"

[lib]
name = "smart_hub_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
notify = "6"
tokio = { version = "1", features = ["full"] }
dirs = "5"
